<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>项目演示视频</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: #0d1117;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }
        .card {
            background: #161b22;
            padding: 40px 30px;
            border-radius: 24px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 32px rgba(0,0,0,0.4);
            max-width: 800px;
            width: 90%;
            text-align: center;
        }
        h1 {
            color: #f0f6fc;
            font-weight: 500;
            font-size: 24px;
            margin-top: 0;
            margin-bottom: 20px;
        }
        video {
            width: 100%;
            border-radius: 12px;
            background: #000;
            border: 1px solid #30363d;
        }
        .caption {
            color: #8b949e;
            font-size: 14px;
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>📹 项目核心演示</h1>
        <!-- ★ 直接引用同目录下的视频文件 ★ -->
        <video controls autoplay muted loop>
            <source src="demo.mp4" type="video/mp4">
            您的浏览器不支持视频标签。
        </video>
        <p class="caption">视频大小仅 2MB，加载极快</p>
    </div>
</body>
</html>
